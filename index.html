<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATH QUIZ — AI Powered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0d0d0e;
      --card-bg: #151518;
      --card-border: #26262c;
      --pink-primary: #ff2a85;
      --pink-glow: rgba(255, 42, 133, 0.35);
      --pink-dark: #cc1163;
      --text-main: #f3f3f6;
      --text-muted: #a0a0ab;
      --easy-color: #10b981;
      --medium-color: #f59e0b;
      --hard-color: #ff2a85;
      --font-family: 'Montserrat', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 42, 133, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 42, 133, 0.05) 0%, transparent 50%);
    }

    .container { width: 100%; max-width: 720px; margin: 0 auto; }

    /* HEADER */
    .header { text-align: center; margin-bottom: 24px; }
    .badge-capsule {
      display: inline-block;
      border: 1.5px solid var(--pink-primary);
      color: var(--pink-primary);
      padding: 6px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      background: rgba(255, 42, 133, 0.05);
    }
    .main-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--pink-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 20px var(--pink-glow);
      margin-bottom: 8px;
    }
    .subtitle { color: var(--text-muted); font-size: 0.95rem; }

    /* GENERATOR */
    .ai-generator-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .topic-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .tag-btn {
      background: #1f1f24;
      border: 1px solid #33333d;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .tag-btn:hover { border-color: var(--pink-primary); color: var(--text-main); }
    .generate-row { display: flex; gap: 10px; margin-top: 12px; }
    .input-field {
      flex: 1;
      background: #09090a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .input-field:focus { outline: none; border-color: var(--pink-primary); }
    .btn-pink {
      background: var(--pink-primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-pink:hover { background: var(--pink-dark); box-shadow: 0 0 15px var(--pink-glow); }
    .btn-pink:disabled { opacity: 0.6; cursor: wait; }

    /* FILTER */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-title { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .filter-btn.active { background: var(--pink-primary); color: #fff; }

    /* PROGRESS */
    .progress-container { margin-bottom: 16px; }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .progress-bar-bg { height: 8px; background: #222228; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--pink-primary); width: 10%; transition: width 0.3s ease; }

    /* CARD */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .diff-badge {
      padding: 4px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .diff-easy { background: rgba(16, 185, 129, 0.15); color: var(--easy-color); border: 1px solid var(--easy-color); }
    .diff-medium { background: rgba(245, 158, 11, 0.15); color: var(--medium-color); border: 1px solid var(--medium-color); }
    .diff-hard { background: rgba(255, 42, 133, 0.15); color: var(--hard-color); border: 1px solid var(--hard-color); }

    .question-title { font-size: 1.25rem; font-weight: 800; line-height: 1.4; margin-bottom: 20px; }

    /* OPTIONS */
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .option-btn {
      background: #0d0d0f;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--pink-primary); background: rgba(255, 42, 133, 0.05); }
    .option-btn:disabled { cursor: default; }
    .opt-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--pink-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .option-btn.selected-correct { border-color: var(--easy-color); background: rgba(16, 185, 129, 0.15); }
    .option-btn.selected-correct .opt-number { background: var(--easy-color); }
    .option-btn.selected-wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); }
    .option-btn.selected-wrong .opt-number { background: #ef4444; }

    /* HINT & SOLUTION */
    .hint-toggle-btn {
      background: transparent;
      border: none;
      color: var(--pink-primary);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      font-family: inherit;
    }
    .hint-box, .solution-box {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .hint-box { background: #1c1c22; border-left: 3px solid var(--pink-primary); color: #d1d1d6; }
    .solution-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .solution-box.correct { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #6ee7b7; }

    .footer-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
    .hidden { display: none !important; }

    /* RESULTS */
    .results-card { text-align: center; padding: 36px 20px; }
    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid var(--pink-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--pink-primary);
      box-shadow: 0 0 25px var(--pink-glow);
    }
    
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="badge-capsule">AI-Powered Math Quiz</div>
      <h1 class="main-title">MATH QUIZ</h1>
      <p class="subtitle">Enter any topic and let Gemini generate 10 unique questions!</p>
    </header>

    <div class="ai-generator-card">
      <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">
        ⚡ AI Quiz Generator
      </div>
      <div class="generate-row">
        <input type="text" id="topicInput" class="input-field" placeholder="e.g. Quadratic Equations, Geometry, Fractions..." />
        <button class="btn-pink" id="generateBtn">Generate</button>
      </div>
      <div class="topic-tags">
        <button class="tag-btn" onclick="document.getElementById('topicInput').value='Algebra'; generateQuizWithAI();">Algebra</button>
        <button class="tag-btn" onclick="document.getElementById('topicInput').value='Geometry'; generateQuizWithAI();">Geometry</button>
        <button class="tag-btn" onclick="document.getElementById('topicInput').value='Probability'; generateQuizWithAI();">Probability</button>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-header">
        <span id="progressText">Question 1 of 10</span>
        <span id="scoreText">Score: 0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <main class="card" id="quizCard">
      <div class="card-top">
        <span class="diff-badge diff-easy" id="diffBadge">EASY</span>
        <span style="font-size:0.8rem; color:var(--text-muted);" id="qIndexText">QUESTION 01 / 10</span>
      </div>
      <h2 class="question-title" id="questionText">Enter a topic and click Generate to start!</h2>
      <div class="options-grid" id="optionsGrid"></div>
      <button class="hint-toggle-btn hidden" id="hintBtn">💡 Need a hint?</button>
      <div class="hint-box hidden" id="hintBox"></div>
      <div class="solution-box hidden" id="solutionBox"></div>
      <div class="footer-actions">
        <button class="btn-pink hidden" id="nextBtn">Next Question ➔</button>
      </div>
    </main>

    <div class="card results-card hidden" id="resultsCard">
      <div class="badge-capsule">Quiz Completed</div>
      <div class="score-circle" id="finalScoreCircle">0/10</div>
      <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 10px;">Great Job!</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px;">You have completed this AI-generated quiz.</p>
      <button class="btn-pink" id="restartBtn">Generate New Quiz</button>
    </div>
  </div>

<script>
  // ==========================================
  // ВСТАВЬТЕ СЮДА ВАШ КЛЮЧ ОТ GOOGLE AI STUDIO
  // ==========================================
  const GEMINI_API_KEY = "ВАШ_КЛЮЧ_ЗДЕСЬ"; 

  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let selectedAnswer = null;

  const generateBtn = document.getElementById("generateBtn");
  const restartBtn = document.getElementById("restartBtn");
  const hintBtn = document.getElementById("hintBtn");
  const nextBtn = document.getElementById("nextBtn");

  // Функция запроса к Gemini
  async function generateQuizWithAI() {
    const topic = document.getElementById("topicInput").value.trim() || "General Math";
    
    generateBtn.innerHTML = '<span class="loader"></span> Generating...';
    generateBtn.disabled = true;

    const prompt = `You are a math teacher. Create a JSON array of exactly 10 multiple-choice math questions about "${topic}".
Do not output any markdown formatting or backticks, just the raw JSON array.
Each object must have exactly these keys:
"question": string
"options": array of 4 strings
"correct": integer (0 to 3, index of the correct option)
"difficulty": string ("EASY", "MEDIUM", or "HARD")
"hint": string
"solution": string`;

    try {
      // Прямой запрос к Google Gemini API
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      if (!response.ok) throw new Error("Ошибка API. Проверьте ключ.");

      const data = await response.json();
      let textResponse = data.candidates[0].content.parts[0].text;
      
      // Очистка от возможных маркеров кода (```json)
      textResponse = textResponse.replace(/```json|```/g, "").trim();
      
      currentQuestions = JSON.parse(textResponse);
      
      if (!Array.isArray(currentQuestions) || currentQuestions.length === 0) {
        throw new Error("Нейросеть вернула неверный формат.");
      }

      // Запуск викторины
      currentIndex = 0;
      score = 0;
      document.getElementById("resultsCard").classList.add("hidden");
      document.getElementById("quizCard").classList.remove("hidden");
      renderQuestion();

    } catch (error) {
      console.error(error);
      alert("Ошибка генерации: " + error.message);
    } finally {
      generateBtn.innerText = "Generate";
      generateBtn.disabled = false;
    }
  }

  function renderQuestion() {
    if (currentIndex >= currentQuestions.length) {
      showResults();
      return;
    }

    const q = currentQuestions[currentIndex];
    selectedAnswer = null;
    
    // Обновление прогресса
    document.getElementById("progressText").innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
    document.getElementById("scoreText").innerText = `Score: ${score}`;
    document.getElementById("progressFill").style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;
    document.getElementById("qIndexText").innerText = `QUESTION ${String(currentIndex + 1).padStart(2, "0")} / ${String(currentQuestions.length).padStart(2, "0")}`;

    // Бейдж сложности
    const diffBadge = document.getElementById("diffBadge");
    diffBadge.innerText = q.difficulty || "MEDIUM";
    diffBadge.className = `diff-badge diff-${(q.difficulty || "MEDIUM").toLowerCase()}`;

    // Текст вопроса
    document.getElementById("questionText").innerText = q.question;

    // Варианты ответов
    const optionsGrid = document.getElementById("optionsGrid");
    optionsGrid.innerHTML = "";
    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.onclick = () => selectOption(idx);
      btn.innerHTML = `<span class="opt-number">${idx + 1}</span><span>${opt}</span>`;
      optionsGrid.appendChild(btn);
    });

    // Сброс подсказок и решений
    document.getElementById("hintBox").classList.add("hidden");
    document.getElementById("hintBox").innerText = q.hint || "";
    document.getElementById("solutionBox").classList.add("hidden");
    document.getElementById("nextBtn").classList.add("hidden");
    
    if (q.hint) {
      hintBtn.classList.remove("hidden");
    } else {
      hintBtn.classList.add("hidden");
    }
  }

  hintBtn.onclick = () => {
    document.getElementById("hintBox").classList.toggle("hidden");
  };

  function selectOption(index) {
    if (selectedAnswer !== null) return;
    selectedAnswer = index;

    const q = currentQuestions[currentIndex];
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(b => b.disabled = true);

    const solutionBox = document.getElementById("solutionBox");
    solutionBox.classList.remove("hidden");

    if (index === q.correct) {
      buttons[index].classList.add("selected-correct");
      score++;
      solutionBox.className = "solution-box correct";
      solutionBox.innerHTML = `<strong>✅ Correct!</strong><br>${q.solution}`;
    } else {
      buttons[index].classList.add("selected-wrong");
      buttons[q.correct].classList.add("selected-correct");
      solutionBox.className = "solution-box";
      solutionBox.innerHTML = `<strong>❌ Incorrect.</strong><br>${q.solution}`;
    }

    document.getElementById("scoreText").innerText = `Score: ${score}`;
    nextBtn.classList.remove("hidden");
  }

  nextBtn.onclick = () => {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
      renderQuestion();
    } else {
      showResults();
    }
  };

  function showResults() {
    document.getElementById("quizCard").classList.add("hidden");
    document.getElementById("resultsCard").classList.remove("hidden");
    document.getElementById("finalScoreCircle").innerText = `${score}/${currentQuestions.length}`;
  }

  generateBtn.onclick = generateQuizWithAI;
  restartBtn.onclick = () => {
    document.getElementById("resultsCard").classList.add("hidden");
    document.getElementById("quizCard").classList.remove("hidden");
    generateQuizWithAI(); // Сразу генерируем новый
  };
</script>
</body>
</html>
